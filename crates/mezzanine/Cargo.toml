[package]
name = "mezzanine"
version.workspace = true
edition.workspace = true
authors.workspace = true
categories.workspace = true
description = "A terminal multiplexer with a built-in pane-local agent"
documentation.workspace = true
homepage.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[[bin]]
name = "mez"
path = "src/main.rs"

[dependencies]
mez-agent = { path = "../mez-agent", version = "0.2.0" }
mez-core = { path = "../mez-core", version = "0.2.0" }
mez-mux = { path = "../mez-mux", version = "0.2.0" }
mez-terminal = { path = "../mez-terminal", version = "0.2.0" }
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
clap = { version = "4", default-features = false, features = ["std", "help", "usage", "derive"] }
clap_complete = "4"
futures-util = "0.3"
include_dir = "0.7"
iroh = { version = "=1.0.3", default-features = false, features = ["platform-verifier", "portmapper", "tls-ring"] }
keyring-core = "1.0"
lz4_flex = { version = "0.11", default-features = false }
merman = { version = "=0.7.0", default-features = false, features = ["ascii"] }
merman-ascii = "=0.7.0"
rand = "0.10"
reqwest = { version = "0.13", default-features = false, features = ["rustls"] }
rpassword = "7"
libc = "0.2"
rusqlite = { version = "0.40", features = ["bundled"] }
rustix = { version = "1.1", features = ["event", "fs", "net", "pipe", "process", "termios"] }
secrecy = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_norway = "0.9"
sha2 = "0.11"
shlex = "2"
tar = { version = "0.4", default-features = false }
thiserror = "2"
tokio = { version = "1", features = ["fs", "io-util", "macros", "net", "process", "rt", "rt-multi-thread", "signal", "sync", "time"] }
tokio-util = { version = "0.7", features = ["codec"] }
toml = "1.1"
toml_edit = "0.25"
unicode-segmentation = "1.12"
unicode-width = "0.2"
urlencoding = "2"
zeroize = "1.8"
zstd = "0.13"

[target.'cfg(any(target_os = "linux", target_os = "freebsd"))'.dependencies]
zbus-secret-service-keyring-store = { version = "1.0", features = ["rt-tokio-crypto-rust"] }

[dev-dependencies]
portable-pty = "0.9"
tokio = { version = "1", features = ["test-util"] }
