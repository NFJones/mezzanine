[package]
name = "mez-agent"
version.workspace = true
edition.workspace = true
authors.workspace = true
categories.workspace = true
description = "Provider-independent agent harness and deterministic policy for Mezzanine"
documentation.workspace = true
homepage.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[lib]
path = "src/lib.rs"

[dependencies]
mez-core = { path = "../mez-core", version = "0.3.0" }
base64 = "0.22"
httpdate = "1"
rand = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_norway = "0.9"
sha2 = "0.11"
shlex = "2"
urlencoding = "2"
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
