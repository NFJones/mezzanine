[package]
name = "mez-agent"
version = "0.1.0"
edition = "2024"
authors = ["Neil F Jones"]
description = "Provider-independent agent harness and deterministic policy for Mezzanine"
license = "Apache-2.0"
documentation = "https://github.com/NFJones/mezzanine#readme"
homepage = "https://github.com/NFJones/mezzanine"
repository = "https://github.com/NFJones/mezzanine"

[lib]
path = "src/lib.rs"

[dependencies]
mez-core = { path = "../mez-core", version = "0.1.0" }
base64 = "0.22"
httpdate = "1"
rand = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_norway = "0.9"
sha2 = "0.11"
shlex = "2"
urlencoding = "2"
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
