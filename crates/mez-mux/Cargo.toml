[package]
name = "mez-mux"
version.workspace = true
edition.workspace = true
authors.workspace = true
categories.workspace = true
description = "Multiplexer domain, PTY, layout, input, and presentation engine for Mezzanine"
documentation.workspace = true
homepage.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[lib]
path = "src/lib.rs"

[dependencies]
mez-core = { path = "../mez-core", version = "0.3.0" }
mez-terminal = { path = "../mez-terminal", version = "0.3.0" }
portable-pty = "0.9"
pulldown-cmark = "0.13"
rustix = { version = "1.1", features = ["event", "fs", "process", "termios"] }
shlex = "2"
syntect = { version = "5.3", default-features = false, features = ["default-syntaxes", "parsing", "regex-fancy"] }
thiserror = "2"
unicode-width = "0.2"
unicode-segmentation = "1.12"

[target.'cfg(target_os = "macos")'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "linux")'.dev-dependencies]
libc = "0.2"
