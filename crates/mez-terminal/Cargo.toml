[package]
name = "mez-terminal"
version = "0.1.0"
edition = "2024"
authors = ["Neil F Jones"]
description = "Terminal parsing, state, history, width, and protocol engine for Mezzanine"
license = "Apache-2.0"
documentation = "https://github.com/NFJones/mezzanine#readme"
