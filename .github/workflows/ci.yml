name: CI
on:
  push:
    branches:
      - main
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    name: "Validate: Linux"
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Cache Cargo artifacts
        uses: Swatinem/rust-cache@v2
      - name: Check formatting
        run: cargo fmt --all --check
      - name: Build
        run: cargo build --all-targets --all-features
      - name: Lint
        run: cargo clippy --all-targets --all-features -- -D warnings
      - name: Test
        run: canonical_tmp="$(cd /tmp && pwd -P)"; TMPDIR="$canonical_tmp" cargo test --workspace --all-targets --all-features --no-fail-fast --quiet
  macos-release-build:
    name: "Validate: macOS"
    runs-on: macos-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Cache Cargo artifacts
        uses: Swatinem/rust-cache@v2
      - name: Check formatting
        run: cargo fmt --all --check
      - name: Build
        run: cargo build --all-targets --all-features
      - name: Lint
        run: cargo clippy --all-targets --all-features -- -D warnings
      - name: Test
        run: canonical_tmp="$(cd /tmp && pwd -P)"; TMPDIR="$canonical_tmp" cargo test --workspace --all-targets --all-features --no-fail-fast --quiet -- --test-threads=1
  managed-shell-reliability:
    name: "Managed shells: ${{ matrix.name }}"
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux
            os: ubuntu-latest
          - name: macOS
            os: macos-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Install managed shells and timeout utility
        run: |
          if [ "${{ runner.os }}" = Linux ]; then
            sudo apt-get update
            sudo apt-get install --yes fish zsh
          else
            brew install fish coreutils
          fi
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Cache Cargo artifacts
        uses: Swatinem/rust-cache@v2
      - name: Run managed-shell reliability suite
        run: canonical_tmp="$(cd /tmp && pwd -P)"; TMPDIR="$canonical_tmp" sh scripts/test-managed-shell-reliability.sh
  release-load:
    name: "Release load: ${{ matrix.name }} (${{ matrix.workers }} workers)"
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux
            os: ubuntu-latest
            artifact: linux-workers-1
            workers: 1
          - name: Linux
            os: ubuntu-latest
            artifact: linux-workers-2
            workers: 2
          - name: Linux
            os: ubuntu-latest
            artifact: linux-workers-4
            workers: 4
          - name: macOS
            os: macos-latest
            artifact: macos-workers-1
            workers: 1
          - name: macOS
            os: macos-latest
            artifact: macos-workers-2
            workers: 2
          - name: macOS
            os: macos-latest
            artifact: macos-workers-4
            workers: 4
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Cache Cargo artifacts
        uses: Swatinem/rust-cache@v2
      - name: Run release responsiveness workload
        env:
          MEZ_RELEASE_LOAD_REPORT: ${{ github.workspace }}/target/release-load/${{ matrix.artifact }}.json
          MEZ_RELEASE_LOAD_WORKERS: ${{ matrix.workers }}
        run: cargo test -p mezzanine --release --lib --all-features --quiet host::async_runtime::tests::services::release_load::release_load_reports_cross_platform_pty_responsiveness -- --exact --ignored --nocapture --test-threads=1
      - name: Upload responsiveness report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-load-${{ matrix.artifact }}
          path: target/release-load/${{ matrix.artifact }}.json
          if-no-files-found: error
