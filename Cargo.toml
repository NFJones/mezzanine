[workspace]
members = [
    "crates/mezzanine",
    "crates/mez-agent",
    "crates/mez-core",
    "crates/mez-mux",
    "crates/mez-terminal",
]
resolver = "3"

[workspace.package]
authors = ["Neil F Jones"]
categories = ["command-line-utilities", "development-tools"]
documentation = "https://github.com/NFJones/mezzanine#readme"
edition = "2024"
homepage = "https://github.com/NFJones/mezzanine"
license = "Apache-2.0"
repository = "https://github.com/NFJones/mezzanine"
rust-version = "1.91"
version = "0.2.0"
